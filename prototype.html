:root{--bg:#f5f6fa;--card:#fff;--ink:#1b1f2e;--muted:#6b7285;--line:#e6e8ef;--line2:#f0f1f6;--brand:#4f46e5;--brand-text:#4f46e5;--brand-soft:#eef0ff;--ok:#0f9d6b;--ok-soft:#e5f6ee;--ok-tx:#0a6b49;--warn:#b7791f;--warn-soft:#fdf3dc;--warn-tx:#7a5210;--bad:#d1344a;--bad-soft:#fde8ec;--bad-tx:#8e1f31;--header-bg:rgba(255,255,255,.92);--today-bg:#fafaff;--switch-off:#c7cbd8;--toast-bg:#1b1f2e;--bgl:94%;--txl:22%;--bdl:48%;--shadow:0 1px 2px rgba(20,24,40,.05),0 6px 24px rgba(20,24,40,.06);--radius:14px;--ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}

:root[data-theme="dark"]{--bg:#0e1120;--card:#171b2f;--ink:#e7e9f4;--muted:#9aa2bb;--line:#2a3050;--line2:#1f2440;--brand:#6a62f0;--brand-text:#aaa5ff;--brand-soft:#262a55;--ok:#3ecf9a;--ok-soft:#10352a;--ok-tx:#8ee6c4;--warn:#e5b04a;--warn-soft:#382c10;--warn-tx:#f0cf8a;--bad:#ff6b82;--bad-soft:#3a1721;--bad-tx:#ffb3c0;--header-bg:rgba(14,17,32,.92);--today-bg:#141833;--switch-off:#3a4160;--toast-bg:#2b3152;--bgl:20%;--txl:86%;--bdl:58%;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.3);color-scheme:dark;}
*{box-sizing:border-box}

/* lists */
.roomcard{padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;justify-content:space-between;gap:8px}

tr:last-child td{border:0}

.stat .card{padding:14px 18px;min-width:150px;flex:1}
.stat b{font-size:24px;display:block}.stat span{color:var(--muted);font-size:12.5px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,18,32,.45);display:grid;place-items:center;z-index:50;padding:16px}

.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.toast.bad{background:#8e1f31}.toast.ok{background:#0a6b49}

.logi .h{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.logi time{margin-left:auto;color:var(--muted);font-size:11.5px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.lock{max-width:460px;margin:60px auto;text-align:center;padding:36px}
.lock .big{font-size:44px;font-weight:700;letter-spacing:-.02em;color:var(--muted)}
.sw{position:relative;width:38px;height:22px;background:var(--switch-off);border-radius:99px;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}.sw.on::after{left:19px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}

.shell{display:flex;align-items:flex-start;min-height:100%}
.content{flex:1;min-width:0}
.right .seg{display:flex}.right .seg button{flex:1}
.modal header{width:auto;height:auto;overflow:visible;border:0;border-bottom:1px solid var(--line)}
@media(max-width:760px){
 .shell{flex-direction:column;align-items:stretch}
 header{width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
 .bar{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
 nav{flex-direction:row;flex:1 1 100%;order:3;overflow-x:auto}
 nav button{width:auto;gap:8px}
 .right{flex-direction:row;align-items:center;flex-wrap:wrap;border:0;padding:0;margin-left:auto}
 .right .seg{display:inline-flex}.right .seg button{flex:none}
 main,.foot{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--header-bg)}
.grid-ev{display:grid;grid-template-columns:380px minmax(0,1fr);gap:18px;align-items:start}
.grid2>*,.grid-rooms>*,.grid-ev>*{min-width:0}
.foot{max-width:1280px;margin:0 auto;padding-block:0 32px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted);font-size:12.5px}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
td,th,.stat b,.blk,.roomcard small,time{font-variant-numeric:tabular-nums}

<div class="shell"><header><div class="bar" id="topbar"></div></header>
<div class="content">
<main id="app"></main>
<p class="foot">Prototype for review. All data is sample data and resets on reload. Use the Student / Staff switch at the top right to see both roles.</p>
</div></div>
<div id="modal"></div>
<div class="toasts" id="toasts"></div>
<script>
/* ============ Mock data (stands in for Cloudflare D1) ============ */
const DAYS=['Mon','Tue','Wed','Thu','Fri'];
const H0=8,H1=18,HH=52;
const t2m=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const m2t=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const overlap=(a,b)=>t2m(a.start)<t2m(b.end)&&t2m(b.start)<t2m(a.end);

const rooms=[
 {id:'rm_a101',name:'A101',capacity:40,building:'Building A'},
 {id:'rm_a102',name:'A102',capacity:30,building:'Building A'},
 {id:'rm_b201',name:'B201',capacity:60,building:'Building B'},
 {id:'rm_b202',name:'B202',capacity:25,building:'Building B'},
 {id:'rm_c301',name:'C301',capacity:50,building:'Building C'},
 {id:'rm_lab1',name:'LAB-1',capacity:30,building:'Computer Center'},
 {id:'rm_lab2',name:'LAB-2',capacity:20,building:'Computer Center'},
 {id:'rm_hall',name:'Hall 1',capacity:120,building:'Building C'},
];
const courses=[
 {id:'c1',code:'SWE204',name:'Software Engineering',credits:3,hue:245},
 {id:'c2',code:'CPE201',name:'Data Structures',credits:3,hue:160},
 {id:'c3',code:'MAT201',name:'Linear Algebra',credits:3,hue:28},
 {id:'c4',code:'ENG102',name:'Academic English',credits:2,hue:330},
 {id:'c5',code:'SWE210',name:'Database Systems',credits:3,hue:200},
 {id:'c6',code:'PHY101',name:'Physics I',credits:3,hue:95},
 {id:'c7',code:'SWE305',name:'Web Programming',credits:3,hue:285},
 {id:'c8',code:'CPE310',name:'Operating Systems',credits:3,hue:5},
];
// base = students enrolled other than the tracked demo student
const sections=[
 {id:'sec_swe204_01',courseId:'c1',no:'01',capacity:55,base:41},
 {id:'sec_cpe201_01',courseId:'c2',no:'01',capacity:40,base:37},
 {id:'sec_mat201_01',courseId:'c3',no:'01',capacity:60,base:52},
 {id:'sec_eng102_01',courseId:'c4',no:'01',capacity:30,base:24},
 {id:'sec_swe210_01',courseId:'c5',no:'01',capacity:30,base:26},
 {id:'sec_phy101_01',courseId:'c6',no:'01',capacity:120,base:96},
 {id:'sec_swe305_01',courseId:'c7',no:'01',capacity:50,base:45},
 {id:'sec_cpe310_01',courseId:'c8',no:'01',capacity:25,base:21},
];
const ME={id:'usr_std_001',name:'Napat Srisuk',role:'student'};
const STAFF={id:'usr_stf_001',name:'Kanya Planner',role:'staff'};
let enrollments=['sec_swe204_01','sec_cpe201_01','sec_mat201_01','sec_eng102_01','sec_swe210_01']
  .map(s=>({student:ME.id,section:s,status:'enrolled'}));
let meetings=[
 {id:'mtg_01',sectionId:'sec_swe204_01',roomId:'rm_b201',day:'Mon',start:'09:00',end:'12:00'},
 {id:'mtg_02',sectionId:'sec_cpe201_01',roomId:'rm_a101',day:'Mon',start:'13:00',end:'15:00'},
 {id:'mtg_03',sectionId:'sec_cpe201_01',roomId:'rm_a101',day:'Wed',start:'13:00',end:'15:00'},
 {id:'mtg_04',sectionId:'sec_mat201_01',roomId:'rm_b201',day:'Tue',start:'09:00',end:'11:00'},
 {id:'mtg_05',sectionId:'sec_mat201_01',roomId:'rm_b201',day:'Thu',start:'09:00',end:'11:00'},
 {id:'mtg_06',sectionId:'sec_eng102_01',roomId:'rm_a102',day:'Tue',start:'13:00',end:'15:00'},
 {id:'mtg_07',sectionId:'sec_swe210_01',roomId:'rm_lab1',day:'Tue',start:'10:00',end:'12:00'},
 {id:'mtg_08',sectionId:'sec_swe210_01',roomId:'rm_lab1',day:'Thu',start:'13:00',end:'15:00'},
 {id:'mtg_09',sectionId:'sec_phy101_01',roomId:'rm_hall',day:'Wed',start:'09:00',end:'11:00'},
 {id:'mtg_10',sectionId:'sec_swe305_01',roomId:'rm_c301',day:'Fri',start:'09:00',end:'12:00'},
 {id:'mtg_11',sectionId:'sec_cpe310_01',roomId:'rm_b202',day:'Wed',start:'15:30',end:'17:30'},
 {id:'mtg_12',sectionId:'sec_swe204_01',roomId:'rm_b201',day:'Thu',start:'15:00',end:'17:00'},
];
let nextId=13;

/* ============ Helpers ============ */
const sec=id=>sections.find(s=>s.id===id);
const rm=id=>rooms.find(r=>r.id===id);
const crs=id=>courses.find(c=>c.id===id);
const secCourse=s=>crs(sec(s).courseId);
const secLabel=id=>{const s=sec(id);return crs(s.courseId).code+'-'+s.no};
const enrolled=id=>{const s=sec(id);return s.base+enrollments.filter(e=>e.section===id&&e.status==='enrolled').length};
const color=c=>({bg:`hsl(${c.hue} 85% var(--bgl))`,bd:`hsl(${c.hue} 60% var(--bdl))`,tx:`hsl(${c.hue} 55% var(--txl))`});
const $=s=>document.querySelector(s);
const nowT=()=>new Date().toLocaleTimeString('en-GB');
const todayIdx=(()=>{const d=new Date().getDay();return d>=1&&d<=5?d-1:-1})();
const timeOpts=[];for(let m=H0*60;m<=H1*60;m+=30)timeOpts.push(m2t(m));

/* ============ App state ============ */
const S={role:'student',view:'timetable',selRoom:'rm_a101',fBuilding:'',fCap:0,fQ:'',
  mQ:'',mDay:'',mRoom:'',aiUp:true,log:[],seen:new Set(),modal:null,sugg:null,suggLoading:false,suggMode:null,
  enrDraft:{event_id:'evt_20260920_001',student:ME.id,section:'sec_swe305_01',action:'enrolled'}};

/* ============ Domain logic (mirrors BR-01, BR-02, FR-07) ============ */
function check(f,ignoreId){
  const errors=[];let http=200;
  if(!f.sectionId||!f.roomId||!f.day||!f.start||!f.end){return{ok:false,http:400,errors:['Missing required fields (section, room, day, start, end).']}}
  if(t2m(f.end)<=t2m(f.start)){errors.push('Invalid time: end time must be after start time (CHECK start_time < end_time).');http=400}
  const room=rm(f.roomId),n=enrolled(f.sectionId);
  if(http===200){
    meetings.filter(m=>m.id!==ignoreId&&m.roomId===f.roomId&&m.day===f.day&&overlap(m,f)).forEach(m=>
      errors.push(`Time clash (BR-01): ${room.name} is already booked ${m.day} ${m.start}–${m.end} by ${secLabel(m.sectionId)}.`));
    if(errors.length)http=409;
  }
  if(n>room.capacity){errors.push(`Over capacity (BR-02): ${secLabel(f.sectionId)} has ${n} enrolled students but ${room.name} seats ${room.capacity}.`);if(http===200)http=400}
  return{ok:!errors.length,http,errors};
}
function suggest(f,ignoreId){
  const dur=t2m(f.end)-t2m(f.start)>0?t2m(f.end)-t2m(f.start):120;
  const n=enrolled(f.sectionId),out=[];
  for(const day of DAYS)for(const r of rooms){
    if(r.capacity<n)continue;
    for(let s=H0*60;s+dur<=H1*60;s+=30){
      const c={roomId:r.id,day,start:m2t(s),end:m2t(s+dur)};
      if(meetings.some(m=>m.id!==ignoreId&&m.roomId===r.id&&m.day===day&&overlap(m,c)))continue;
      if(meetings.some(m=>m.id!==ignoreId&&m.sectionId===f.sectionId&&m.day===day&&overlap(m,c)))continue;
      const score=(r.id===f.roomId?0:30)+(day===f.day?0:20+Math.abs(DAYS.indexOf(day)-DAYS.indexOf(f.day))*4)+Math.abs(s-t2m(f.start||'09:00'))/10+(r.capacity-n)/8;
      out.push({...c,score,why:[r.id===f.roomId?'same room':'room '+r.name,day===f.day?'same day':day,`${r.capacity-n} spare seats`].join(' · ')});
    }
  }
  return out.sort((a,b)=>a.score-b.score).slice(0,5);
}
function logEvt(dir,name,payload,extra){S.log.unshift({dir,name,payload,extra,ts:nowT()})}
function emitSchedule(action,m){
  const p={event_id:'evt_'+Date.now(),event_name:'schedule.changed',action,meeting_id:m.id,section_id:m.sectionId,room_id:m.roomId,day:m.day,start_time:m.start,end_time:m.end,timestamp:new Date().toISOString()};
  logEvt('OUT','schedule.changed',p,'→ Notification Hub, Data & Analytics (mock)');
}
function toast(msg,kind){
  const el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;$('#toasts').appendChild(el);
  setTimeout(()=>el.remove(),3800);
}
function studentMeetings(){
  const mine=enrollments.filter(e=>e.student===ME.id&&e.status==='enrolled').map(e=>e.section);
  return meetings.filter(m=>mine.includes(m.sectionId));
}
function studentClashes(){
  const ms=studentMeetings(),out=[];
  for(let i=0;i<ms.length;i++)for(let j=i+1;j<ms.length;j++)
    if(ms[i].day===ms[j].day&&overlap(ms[i],ms[j]))out.push([ms[i],ms[j]]);
  return out;
}

/* ============ Renderers ============ */
function grid(blocks){
  // lay out overlapping blocks side by side
  blocks.forEach(b=>{
    const g=blocks.filter(o=>o.day===b.day&&overlap(o,b));
    b._n=g.length;b._i=g.indexOf(b);
  });
  let hours='';for(let h=H0;h<H1;h++)hours+=`<span style="top:${(h-H0)*HH}px">${String(h).padStart(2,'0')}:00</span>`;
  const cols=DAYS.map((d,i)=>{
    const bs=blocks.filter(b=>b.day===d).map(b=>{
      const top=(t2m(b.start)-H0*60)/60*HH,h=(t2m(b.end)-t2m(b.start))/60*HH-2;
      const w=100/b._n;
      return `<div class="blk ${b.cls||''}" ${b.edit?`data-edit="${b.edit}"`:''} title="${b.title}" style="top:${top}px;height:${h}px;left:calc(${b._i*w}% + 3px);width:calc(${w}% - 6px);background:${b.c.bg};border-color:${b.c.bd};color:${b.c.tx}">
        <b>${b.title}</b>${b.l1||''}<br>${b.l2||''}</div>`;
    }).join('');
    return `<div class="tt-col ${i===todayIdx?'today':''}" style="height:${(H1-H0)*HH}px">${bs}</div>`;
  }).join('');
  return `<div class="ttwrap"><div class="tt" style="--hh:${HH}px">
    <div class="tt-head"><div></div>${DAYS.map((d,i)=>`<div class="${i===todayIdx?'today':''}">${d}</div>`).join('')}</div>
    <div class="tt-body"><div class="tt-hours" style="height:${(H1-H0)*HH}px">${hours}</div>${cols}</div></div></div>`;
}

async function doSuggest(){
  const M=S.modal;S.suggLoading=true;S.sugg=null;renderModal();
  if(S.aiUp){await new Promise(r=>setTimeout(r,700));S.suggMode='ai'}
  else{await new Promise(r=>setTimeout(r,150));S.suggMode='fallback'}
  S.sugg=suggest(M.f,M.id);S.suggLoading=false;
  logEvt('API','POST /api/conflicts/check',{section_id:M.f.sectionId,suggestions:S.sugg.length,engine:S.suggMode==='ai'?'ai':'deterministic-fallback'});
  renderModal();
}
function doSave(){
  const M=S.modal,res=check(M.f,M.id);
  if(!res.ok){M.attempt=res;logEvt('API',(M.id?'PATCH /api/meetings/'+M.id:'POST /api/meetings')+' → '+res.http,res.errors.join('\n'));toast(`Rejected · HTTP ${res.http}`,'bad');renderModal();return}
  if(M.id){const m=meetings.find(x=>x.id===M.id);Object.assign(m,M.f);emitSchedule('updated',m);logEvt('API','PATCH /api/meetings/'+m.id+' → 200','updated');toast('Meeting updated · schedule.changed sent','ok')}
  else{const m={id:'mtg_'+String(nextId++).padStart(2,'0'),...M.f};meetings.push(m);emitSchedule('created',m);logEvt('API','POST /api/meetings → 201',m.id);toast('Meeting created · schedule.changed sent','ok')}
  S.modal=null;renderModal();render();
}
function doDelete(id){
  const m=meetings.find(x=>x.id===id);if(!m)return;S.confirmDel=null;
  meetings=meetings.filter(x=>x.id!==id);emitSchedule('deleted',m);logEvt('API','DELETE /api/meetings/'+id+' → 204','');
  toast('Meeting deleted · schedule.changed sent','ok');renderModal();render();
}
function askDelete(id){S.confirmDel=id;renderModal()}
function sendEnrollment(replay){
  const d=S.enrDraft;
  const p={event_id:d.event_id,event_name:'enrollment.changed',student_id:d.student,section_id:d.section,action:d.action,timestamp:new Date().toISOString()};
  const before=enrolled(d.section);
  if(S.seen.has(p.event_id)){
    logEvt('IN','enrollment.changed',p,'↻ duplicate event_id — ignored, no side effects (BR-07)');
    toast(`Duplicate ignored · count stays ${before}`);render();return;
  }
  S.seen.add(p.event_id);
  const ex=enrollments.find(e=>e.student===d.student&&e.section===d.section);
  const status=d.action==='enrolled'?'enrolled':d.action;
  if(ex)ex.status=status;else enrollments.push({student:d.student,section:d.section,status});
  const after=enrolled(d.section);
  const over=meetings.filter(m=>m.sectionId===d.section&&after>rm(m.roomId).capacity);
  logEvt('IN','enrollment.changed',p,`upsert OK · ${secLabel(d.section)} count ${before} → ${after}`+(over.length?` · ⚠ over capacity in ${over.map(m=>rm(m.roomId).name).join(', ')}`:''));
  toast(`Processed · ${secLabel(d.section)} now ${after}`+(over.length?' · capacity conflict!':''),over.length?'bad':'ok');
  S.lastEvt=p.event_id;render();
}

/* ============ Events ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-role],[data-room],[data-new],[data-new-room],[data-edit],[data-del],[data-close],[data-save],[data-suggest],[data-apply],[data-send-enr],[data-replay],[data-toggle-ai],[data-clear],[data-cancel-del],[data-confirm-del]');
  if(!t)return;const d=t.dataset;
  if((d.close==='scrim'||d.close==='confirm')&&e.target!==t)return;
  if(d.view){S.view=d.view;render()}
  else if(d.role){S.role=d.role;S.view=d.role==='staff'?'rooms':'timetable';render()}
  else if(d.room){S.selRoom=d.room;render()}
  else if(d.new){openModal(null)}
  else if(d.newRoom){openModal(null,d.newRoom)}
  else if(d.edit){openModal(meetings.find(m=>m.id===d.edit))}
  else if(d.del){askDelete(d.del)}
  else if(d.cancelDel){S.confirmDel=null;renderModal()}
  else if(d.confirmDel){doDelete(S.confirmDel)}
  else if(d.close){S.modal=null;S.confirmDel=null;renderModal()}
  else if(d.save){doSave()}
  else if(d.suggest){doSuggest()}
  else if(d.apply!==undefined){const s=S.sugg[+d.apply];Object.assign(S.modal.f,{roomId:s.roomId,day:s.day,start:s.start,end:s.end});S.modal.attempt=null;S.sugg=null;S.suggMode=null;renderModal();toast('Slot applied — review and save')}
  else if(d.sendEnr){sendEnrollment()}
  else if(d.replay){S.enrDraft.event_id=S.lastEvt||S.enrDraft.event_id;sendEnrollment(true)}
  else if(d.toggleAi){S.aiUp=!S.aiUp;toast(S.aiUp?'AI service online':'AI service down — fallback active');render()}
  else if(d.clear){S.log=[];render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f){S.modal.f[t.dataset.f]=t.value;S.modal.attempt=null;S.sugg=null;S.suggMode=null;renderModal();return}
  const map={fb:()=>S.fBuilding=t.value,fc:()=>S.fCap=+t.value,md:()=>S.mDay=t.value,mr:()=>S.mRoom=t.value,
    e_sec:()=>S.enrDraft.section=t.value,e_act:()=>S.enrDraft.action=t.value,e_id:()=>S.enrDraft.event_id=t.value};
  if(map[t.id]){map[t.id]();render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='fq'||t.id==='mq'){
    const pos=t.selectionStart;if(t.id==='fq')S.fQ=t.value;else S.mQ=t.value;render();
    const n=document.getElementById(t.id);n.focus();n.setSelectionRange(pos,pos);
  }
});
render();
</script>
